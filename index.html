<style>
:root{
  --bg:#eef0fb; --paper:#ffffff; --ink:#12163a; --muted:#5c6288; --line:#cbd0ee;
  --accent:#d81b60; --accent-ink:#ffffff; --err:#b3261e;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0c0f26;--paper:#141939;--ink:#eceeff;--muted:#9298c4;--line:#252b55;--accent:#ff5c97;--accent-ink:#1a0610;--err:#ff8a80}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;-webkit-mask-image:linear-gradient(#000,transparent 65%);mask-image:linear-gradient(#000,transparent 65%)}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:22px 22px 72px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:10px;padding-bottom:44px}
.logo{width:30px;height:30px;color:var(--ink)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;align-items:center}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,5.4vw,4.1rem);line-height:1.04;letter-spacing:-.035em;margin:0 0 18px}
.lead{color:var(--muted);font-size:1.08rem;max-width:40ch;margin:0 0 30px}

.field{display:flex;border:1.5px solid var(--ink);border-radius:14px;background:var(--paper);overflow:hidden}
.field:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:14px 16px;outline:none}
.field input::placeholder{color:var(--muted)}
.go{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:0 20px;cursor:pointer}
.go:disabled{opacity:.55;cursor:progress}
button:focus-visible,.drop:focus-within,#cmp:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.drop{position:relative;display:flex;align-items:center;gap:14px;margin-top:12px;padding:18px;border:1.5px dashed var(--muted);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop b{display:block}.drop span{color:var(--muted);font-size:.9rem}
#status{margin:16px 0 0;min-height:1.6em;font-size:.95rem}
#status.err{color:var(--err);font-weight:500}
.small{color:var(--muted);font-size:.85rem;margin:6px 0 0}

.stage{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;background:var(--paper);border:1.5px solid var(--ink);box-shadow:0 36px 60px -34px rgba(18,22,58,.55);user-select:none;-webkit-user-select:none;touch-action:pan-y;--p:50%}
.layer{position:absolute;inset:0}
.layer img,.layer svg{display:block;width:100%;height:100%;object-fit:cover}
.after{clip-path:inset(0 0 0 var(--p))}
.demo .before svg{filter:blur(3.5px) saturate(.65) contrast(.9);transform:scale(1.04)}
.line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(18,22,58,.35);pointer-events:none}
.knob{position:absolute;top:50%;left:var(--p);width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);display:grid;place-items:center;pointer-events:none}
.knob .ico{width:22px;height:22px}
.tag{position:absolute;top:14px;padding:5px 11px;border-radius:999px;font-size:.82rem;font-weight:700;pointer-events:none;background:rgba(18,22,58,.8);color:#fff}
.tag.l{left:14px}.tag.r{right:14px;background:var(--accent);color:var(--accent-ink)}
#cmp{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize}
.stage::after{content:"";position:absolute;top:0;bottom:0;left:-24%;width:24%;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.stage.busy::after{opacity:.4;animation:scan 1.5s ease-in-out infinite}
@keyframes scan{to{left:100%}}
.actions{display:none;gap:10px;flex-wrap:wrap;margin-top:16px}
.actions.on{display:flex}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:700;padding:11px 16px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:860px){.grid{grid-template-columns:1fr;gap:34px}header{padding-bottom:30px}}
@media (prefers-reduced-motion:reduce){.stage.busy::after{animation:none;left:38%}.drop{transition:none}}

.topbar{
  position:relative;z-index:50;display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1.5px solid var(--line);
  background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

.topbar .title{
  font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:.02em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--accent),var(--ink));-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.menu-btn{
  width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:var(--paper);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,transform .1s;
}
.menu-btn:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.menu-btn:active{transform:scale(.94)}
.menu-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.menu-panel{
  position:absolute;top:calc(100% + 8px);right:22px;min-width:230px;
  background:var(--paper);border:1.5px solid var(--ink);border-radius:16px;
  box-shadow:0 24px 48px -18px rgba(18,22,58,.4);padding:10px;
  display:none;flex-direction:column;gap:4px;
}
.menu-panel.open{display:flex}
.menu-panel .menu-title{
  font-family:var(--display);font-weight:800;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;text-align:center;
}
.menu-panel a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  color:var(--ink);text-decoration:none;font-weight:600;font-size:.92rem;
  transition:background .15s,color .15s;
}
.menu-panel a:hover{background:var(--accent);color:var(--accent-ink)}
.menu-panel a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-overlay{position:fixed;inset:0;z-index:40;display:none}
.menu-overlay.open{display:block}

html, body{ width:100%; max-width:100%; overflow-x:hidden; overscroll-behavior-x:none; }
body{ touch-action:pan-y; -webkit-tap-highlight-color:transparent; }
.wrap, .grid, header, section, .stage, .field, .drop{ max-width:100%; min-width:0; }
input, textarea, select{ font-size:16px; }
@media (max-width:600px){

  .wrap{ padding:16px 14px 56px; }
  .topbar{ padding:12px 14px; }
  .menu-panel{ right:14px; left:14px; min-width:0; }
}

<script>
  /* ===== ENDPOINT REMINI ===== */
  const REMINI_API = "/api/remini";
  const UPLOAD_API = "/api/upload";
  const DL_API = "/api/dl";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), goBtn = $("go"), box = $("box");
  let resultUrl = "";

  function setStatus(msg, type) { statusEl.textContent = msg || ""; statusEl.className = type || ""; }

  async function readJson(r) {
    const text = await r.text();
    if (!text) throw new Error("Server tidak mengirim respons (HTTP " + r.status + ").");
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw new Error("Respons bukan JSON (HTTP " + r.status + "): " + text.replace(/<[^>]*>/g, " ").trim().slice(0, 120)); }
    if (data && data.status === false && data.message) throw new Error(data.message);
    return data;
  }

  async function callRemini(imageUrl) {
    const r = await fetch(REMINI_API + "?url=" + encodeURIComponent(imageUrl), {
      headers: { "Accept": "application/json, text/plain, */*" }
    });
    return await readJson(r);
  }

  async function shrink(file) {
    const LIMIT = 4 * 1024 * 1024;
    if (file.size <= LIMIT) return file;
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    if (!blob || blob.size > LIMIT) throw new Error("Foto terlalu besar. Pilih foto yang lebih kecil.");
    return blob;
  }

  async function uploadThenRemini(file) {
    const body = await shrink(file);
    const up = await readJson(await fetch(UPLOAD_API, {
      method: "POST",
      headers: { "Content-Type": body.type || "image/jpeg" },
      body
    }));
    if (!up || !up.status || !up.url) throw new Error("Upload gagal: " + (up && up.message ? up.message : "URL tidak diterima."));
    return await callRemini(up.url);
  }

  function move(v) { box.style.setProperty("--p", v + "%"); }

  function show(original, upscaled) {
    resultUrl = upscaled;
    const probe = new Image();
    probe.onload = () => {
      const ratio = Math.min(1.6, Math.max(0.75, probe.naturalWidth / probe.naturalHeight));
      box.style.aspectRatio = ratio;
    };
    probe.src = original;
    $("lb").innerHTML = ""; $("la").innerHTML = "";
    const a = new Image(), b = new Image();
    a.alt = "Gambar asli"; a.src = original;
    b.alt = "Gambar Hasil Remini"; b.src = upscaled;
    $("lb").appendChild(a); $("la").appendChild(b);
    box.classList.remove("demo");
    $("cmp").value = 50; move(50);
    $("open").href = upscaled;
    $("actions").classList.add("on");
  }

  function handleRemini(data, original) {
    const out = data && data.status && data.data && data.data.url;
    if (!out) throw new Error("API Remini tidak mengembalikan gambar. Coba link lain.");
    show(original, out);
    setStatus("Selesai. Geser garis untuk membandingkan.");
  }

  async function run(fn, original) {
    goBtn.disabled = true;
    box.classList.add("busy");
    setStatus("Memproses Remini, Perkiraan 10–30 Detik…");
    try {
      handleRemini(await fn(), original);
    } catch (e) {
      setStatus(e.message || "Gagal memproses. Periksa link atau coba lagi.", "err");
    } finally {
      goBtn.disabled = false;
      box.classList.remove("busy");
    }
  }

  goBtn.onclick = () => {
    const u = $("url").value.trim();
    if (!/^https?:\/\//i.test(u)) return setStatus("Masukkan link gambar yang diawali https://", "err");
    run(() => callRemini(u), u);
  };
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") goBtn.click(); });

  function takeFile(f) {
    if (!f) return;
    if (!f.type.startsWith("image/")) return setStatus("File Harus Berupa Gambar.", "err");
    run(() => uploadThenRemini(f), URL.createObjectURL(f));
  }
  $("file").onchange = (e) => takeFile(e.target.files[0]);

  const drop = $("drop");
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => takeFile(e.dataTransfer.files[0]));

  $("cmp").oninput = (e) => move(e.target.value);

  $("dl").onclick = () => {
    if (!resultUrl) return setStatus("Belum ada hasil untuk diunduh.", "err");
    const a = document.createElement("a");
    a.href = DL_API + "?url=" + encodeURIComponent(resultUrl);
    a.download = "Remini-HD.jpg";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setStatus("Mengunduh hasil Remini HD…");
  };

  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(resultUrl); setStatus("Link hasil disalin."); }
    catch (e) { setStatus("Gagal menyalin. Gunakan tombol Buka.", "err"); }
  };

  (function(){
    const btn = document.getElementById('menuBtn');
    const panel = document.getElementById('menuPanel');
    const overlay = document.getElementById('menuOverlay');
    function close(){ panel.classList.remove('open'); overlay.classList.remove('open'); btn.setAttribute('aria-expanded','false'); }
    function toggle(e){
      e.stopPropagation();
      const open = panel.classList.toggle('open');
      overlay.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', close);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
    document.addEventListener('click', (e) => {
      if (panel.classList.contains('open') && !panel.contains(e.target) && !btn.contains(e.target)) close();
    });
    panel.querySelectorAll('a').forEach(a => a.addEventListener('click', close));
  })();
</script>
</body>
</html>
